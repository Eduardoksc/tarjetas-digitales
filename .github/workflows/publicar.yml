# Robot que publica las tarjetas.
# Se activa solo cuando:
#   1) subes cambios al repositorio (push)
#   2) pasan 10 minutos (lee la hoja y publica solo si algo cambió)
#   3) lo pides a mano (pestaña Actions → "Publicar tarjetas" → Run workflow)
#   4) presionas "Tarjetas → Publicar ahora" en tu hoja de Google (opcional, ver la guía)
# Publica en dos lugares: GitHub Pages (la dirección actual) y Cloudflare Pages (el dominio propio).
# Si una publicación falla, la reintenta sola.
name: Publicar tarjetas

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [actualizar-hoja]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      cambio: ${{ steps.revisar.outputs.cambio }}
      huella: ${{ steps.huella.outputs.valor }}
    steps:
      # Versiones que corren en Node 24 (GitHub retiró Node 20 de las acciones)
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar la herramienta de imágenes (recorta y ajusta los logos)
        run: npm ci --no-audit --no-fund
      - name: Crear las páginas desde la hoja
        run: node generar.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          PIE_TEXTO: ${{ vars.PIE_TEXTO }}
          PIE_URL: ${{ vars.PIE_URL }}
          SITIO_URL: ${{ vars.SITIO_URL }}
          CONTADOR_URL: ${{ vars.CONTADOR_URL }}

      # Huella de todo lo construido. Si es igual a la última publicada, no hace falta publicar.
      # Incluye si Cloudflare está configurado, para publicar apenas se agreguen sus secretos.
      - name: Calcular la huella de las páginas
        id: huella
        env:
          CON_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          suma=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-40)
          echo "valor=$suma-cf-$CON_CLOUDFLARE" >> "$GITHUB_OUTPUT"
      - name: Buscar la última publicación
        id: anterior
        uses: actions/cache/restore@v5
        with:
          path: .ultima-publicacion
          key: publicado-${{ steps.huella.outputs.valor }}
          lookup-only: true
      - name: Decidir si hay que publicar
        id: revisar
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.anterior.outputs.cache-hit }}" = "true" ]; then
            echo "Sin cambios desde la última publicación. No se publica."
            echo "cambio=false" >> "$GITHUB_OUTPUT"
          else
            echo "cambio=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v6
        if: steps.revisar.outputs.cambio == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.revisar.outputs.cambio == 'true'
        with:
          path: dist
      - name: Guardar las páginas para Cloudflare
        if: steps.revisar.outputs.cambio == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: paginas
          path: dist
          retention-days: 1

  publicar:
    needs: construir
    if: needs.construir.outputs.cambio == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.reintento.outputs.page_url }}
    steps:
      # GitHub a veces responde "Deployment failed, try again later": se espera un momento y se reintenta
      - id: despliegue
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.despliegue.outcome == 'failure'
        run: sleep 90
      - id: reintento
        if: steps.despliegue.outcome == 'failure'
        uses: actions/deploy-pages@v5

  cloudflare:
    needs: construir
    if: needs.construir.outputs.cambio == 'true'
    runs-on: ubuntu-latest
    steps:
      # El contador de visitas y toques (functions/ y servidor/) se publica junto con las páginas
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            functions
            servidor
      - name: Traer las páginas construidas
        uses: actions/download-artifact@v7
        with:
          name: paginas
          path: dist
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publicar en Cloudflare Pages (proyecto fides-tarjetas)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail  # sin esto, un fallo de wrangler quedaba oculto detrás de tee
          # Quita espacios y saltos de línea que se cuelan al pegar los secretos
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare aún no está configurado (faltan los secretos). Se omite."
            exit 0
          fi
          for intento in 1 2 3; do
            if npx --yes wrangler@4.151.3 pages deploy dist --project-name=fides-tarjetas --branch=main --commit-dirty=true 2>&1 | tee salida.txt; then
              exit 0
            fi
            echo "::warning::Cloudflare no respondió bien (intento $intento de 3)."
            [ "$intento" -lt 3 ] && sleep 60
          done
          # Deja el motivo como aviso visible sin iniciar sesión (sin el número de cuenta)
          grep -iE "error|✘|code:|not found|authentication|permission" salida.txt | sed "s/$CLOUDFLARE_ACCOUNT_ID/<cuenta>/g" | tail -6 | while IFS= read -r linea; do echo "::error::$linea"; done
          exit 1

  # Solo si las dos publicaciones salieron bien se anota la huella, para no repetir la próxima vez
  recordar:
    needs: [construir, publicar, cloudflare]
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.construir.outputs.huella }}" > .ultima-publicacion
      - uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .ultima-publicacion
          key: publicado-${{ needs.construir.outputs.huella }}
