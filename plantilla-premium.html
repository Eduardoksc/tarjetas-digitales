<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d0d">
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRIPCION}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CO">
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="{{DESCRIPCION}}">
{{META_ENLACES}}
<link rel="preload" href="../fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Tema "Premium" (columna estilo = premium): negro profundo, la reseña como pieza de oro, botones satinados con filo dorado.
     El color del negocio no se usa: la identidad la da el logo. */
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url("../fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: swap; src: url("../fonts/inter-600.woff2") format("woff2"); }
  :root {
    --fondo: #0d0d0d;
    --sup: #1b1b1d;
    --sup2: #232326;
    --linea: rgba(212, 176, 106, .34);  /* filo dorado de 1 px */
    --texto: #f4efe6;                    /* marfil */
    --suave: #a8a196;                    /* 7.6:1 sobre el fondo */
    --tenue: #8a8478;
    --oro: #d4b06a;
    --oro-a: #9a7b33;                    /* tono oscuro del degradado: el texto negro da 4.9:1 aquí */
    --oro-b: #eacaa6;
    --negro: #0b0b0b;
    --entra: cubic-bezier(.2, .8, .2, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--fondo); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    color: var(--texto);
    background: var(--fondo) radial-gradient(130% 55% at 50% -12%, #241e14 0%, rgba(13, 13, 13, 0) 62%) no-repeat;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 44px 24px 24px;
    padding: max(44px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    text-align: center;
  }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a:focus-visible { outline: 2px solid var(--oro); outline-offset: 4px; }

  /* ---------- Cabecera: medallón (logo compacto) o cápsula (logo ancho, para no recortarlo) ---------- */
  .cab { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 104px;
    height: 104px;
    margin-bottom: 20px;
    border-radius: 50%;
    overflow: hidden;
    background: #151517;
    box-shadow: 0 0 0 1px var(--linea), 0 0 0 6px var(--fondo), 0 0 0 7px rgba(212, 176, 106, .16);
  }
  .logo img { display: block; width: auto !important; height: auto; max-width: 70%; max-height: 70%; }
  .cab.apilada .logo { width: auto; height: auto; max-width: 100%; padding: 14px 28px; border-radius: 999px; }
  .cab.apilada .logo img { max-width: 190px; max-height: 54px; }
  .logo.fondo-blanco { background: #fff; }
  .logo.fondo-oscuro, .logo.sin { background: #151517; }
  .logo.tal img { max-width: 100%; max-height: 100%; }
  .logo.inicial { font-size: 40px; font-weight: 600; color: var(--oro); }
  .nom { margin: 0; font-size: 1.45rem; font-weight: 600; line-height: 1.2; letter-spacing: -.015em; overflow-wrap: anywhere; }
  .slogan { display: block; margin: 6px 0 0; font-size: .92rem; font-weight: 400; line-height: 1.4; letter-spacing: 0; color: var(--suave); }
  .nombre-en-logo .nom-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nombre-en-logo .slogan { margin-top: 0; }

  /* ---------- Titular con línea de oro ---------- */
  h2 { position: relative; margin: 0 0 30px; padding-top: 26px; font-size: 1.5rem; font-weight: 400; line-height: 1.25; letter-spacing: -.02em; color: #e3dccf; overflow-wrap: anywhere; }
  h2::before { content: ""; position: absolute; top: 0; left: 50%; width: 40px; height: 1px; margin-left: -20px; background: linear-gradient(90deg, rgba(212, 176, 106, 0), var(--oro), rgba(212, 176, 106, 0)); }

  /* ---------- Reseña: pieza de oro con un solo destello al abrir ---------- */
  .res {
    position: relative;
    display: block;
    overflow: hidden;
    margin: 0 0 16px;
    padding: 20px 20px 18px;
    border-radius: 20px;
    color: var(--negro);
    background: linear-gradient(135deg, var(--oro-b) 0%, #d8b680 48%, var(--oro-a) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 22px 44px -22px rgba(212, 176, 106, .55);
    transition: transform .24s var(--entra), filter .24s var(--entra);
  }
  .res::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
    transform: translateX(-130%);
    background: linear-gradient(105deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .5) 50%, rgba(255, 255, 255, 0) 70%);
    animation: brillo 1.3s .75s var(--entra);
  }
  .res:active { transform: scale(.98); filter: brightness(.95); transition-duration: .09s; }
  .res .arr { display: flex; align-items: center; justify-content: center; margin-bottom: 14px; font-size: 1rem; font-weight: 600; line-height: 1.3; }
  .res .g { width: 32px; height: 32px; margin-right: 10px; flex: none; padding: 5px; border-radius: 50%; background: #fff; }
  .res .est { display: flex; justify-content: center; }
  .res .est svg { width: 15%; max-width: 46px; height: auto; margin: 0 4px; overflow: visible; }
  /* Estrellas vacías: una ola breve invita a tocar y vuelven a quedar vacías */
  .res .est path { fill: transparent; stroke: var(--negro); stroke-width: 1.3; stroke-linejoin: round; animation: invita .26s ease-out; }
  .res .est svg:nth-child(1) path { animation-delay: .32s; }
  .res .est svg:nth-child(2) path { animation-delay: .38s; }
  .res .est svg:nth-child(3) path { animation-delay: .44s; }
  .res .est svg:nth-child(4) path { animation-delay: .5s; }
  .res .est svg:nth-child(5) path { animation-delay: .56s; }
  .res .cta { display: flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 14px; padding: 0 20px; border-radius: 999px; background: var(--negro); color: var(--oro-b); font-size: .98rem; font-weight: 600; }
  .fl { width: 20px; height: 20px; margin-left: 8px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .24s var(--entra); }
  .res:active .fl { transform: translateX(4px); transition-duration: .09s; }
  .res .nota { display: block; margin-top: 12px; font-size: .82rem; line-height: 1.4; }

  /* ---------- Botones satinados con filo dorado ---------- */
  .rej { display: grid; grid-template-columns: repeat(6, 1fr); grid-gap: 10px; padding-bottom: 8px; }
  .tl {
    grid-column: span 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100px;
    padding: 16px 6px 14px;
    border: 1px solid var(--linea);
    border-radius: 16px;
    background: var(--sup) linear-gradient(180deg, var(--sup2), var(--sup));
    color: var(--texto);
    font-size: .84rem;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: .005em;
    transition: transform .24s var(--entra), border-color .24s var(--entra);
    animation: aparece .5s var(--entra) backwards;
  }
  .tl:active { transform: scale(.98); border-color: rgba(234, 202, 166, .75); transition-duration: .09s; }
  .tl:nth-child(1) { animation-delay: .16s; }
  .tl:nth-child(2) { animation-delay: .22s; }
  .tl:nth-child(3) { animation-delay: .28s; }
  .tl:nth-child(4) { animation-delay: .34s; }
  .tl:nth-child(5) { animation-delay: .4s; }
  .tl:nth-child(6) { animation-delay: .46s; }
  .tl:nth-child(7) { animation-delay: .52s; }
  .tl:nth-child(8) { animation-delay: .58s; }
  .tl .ic { display: block; margin-bottom: 10px; color: var(--oro); }
  .tl svg { display: block; width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tl svg.relleno { fill: currentColor; stroke: none; }
  .tl .tx { display: block; max-width: 100%; overflow-wrap: anywhere; }
  .rej.n1 .tl { grid-column: span 6; flex-direction: row; min-height: 68px; }
  .rej.n1 .tl .ic { margin: 0 12px 0 0; }
  .rej.n2 .tl, .rej.n4 .tl { grid-column: span 3; }
  .rej.n5 .tl:nth-child(n+4) { grid-column: span 3; }
  /* Con 6 o más acciones van en parejas: en tres columnas las palabras largas ("Administración") se parten */
  .rej.n6 .tl, .rej.n7 .tl, .rej.n8 .tl { grid-column: span 3; }
  .rej.n7 .tl:last-child { grid-column: span 6; flex-direction: row; min-height: 68px; }
  .rej.n7 .tl:last-child .ic { margin: 0 12px 0 0; }

  /* ---------- Redes sociales: círculos satinados con ícono dorado ---------- */
  .redes { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 30px; }
  .redes a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    margin: 0 7px 10px;
    border-radius: 50%;
    border: 1px solid var(--linea);
    background: var(--sup);
    color: var(--oro);
    transition: transform .22s var(--entra), border-color .22s var(--entra);
    animation: aparece .45s .42s var(--entra) backwards;
  }
  .redes a:active { transform: scale(.92); border-color: rgba(234, 202, 166, .8); transition-duration: .09s; }
  .redes svg { width: 20px; height: 20px; fill: currentColor; }

  /* ---------- Portada opcional: foto con filo dorado; el medallón del logo se monta encima ---------- */
  .portada { display: block; width: 100%; height: auto; aspect-ratio: 9 / 5; object-fit: cover; margin-bottom: 0; border-radius: 20px; box-shadow: 0 0 0 1px var(--linea); background: #151517; }
  .con-portada .cab { margin-top: -52px; }

  /* ---------- Wi-Fi: se despliega al tocar (sin JavaScript) ---------- */
  .wifi { margin-top: 10px; border: 1px solid var(--linea); border-radius: 16px; background: var(--sup) linear-gradient(180deg, var(--sup2), var(--sup)); text-align: left; animation: aparece .5s .44s var(--entra) backwards; }
  .wifi summary { display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 10px 14px; font-size: .9rem; font-weight: 600; cursor: pointer; list-style: none; -webkit-tap-highlight-color: transparent; transition: transform .24s var(--entra); }
  .wifi summary::-webkit-details-marker { display: none; }
  .wifi summary:active { transform: scale(.98); transition-duration: .09s; }
  .wifi summary:focus-visible { outline: 2px solid var(--oro); outline-offset: 4px; border-radius: 16px; }
  .wifi .ic { display: block; margin-right: 10px; color: var(--oro); }
  .wifi svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .wf-panel { display: flex; flex-wrap: wrap; justify-content: center; padding: 4px 16px 16px; border-top: 1px solid var(--linea); text-align: center; }
  .wf-dato { display: flex; flex-direction: column; margin: 12px 16px 0; }
  .wf-et { font-size: .72rem; letter-spacing: .06em; color: var(--suave); }
  .wf-red, .wf-clave { font-size: 1.05rem; font-weight: 600; letter-spacing: .02em; color: var(--texto); overflow-wrap: anywhere; }
  .wf-clave { color: var(--oro); -webkit-user-select: all; user-select: all; }

  .base { margin-top: auto; }
  .pie { margin: 0; padding-top: 24px; font-size: .75rem; letter-spacing: .04em; color: var(--tenue); }
  .pie a { display: inline-block; min-height: 48px; padding: 15px 12px; text-decoration: underline; text-decoration-color: var(--linea); text-underline-offset: 4px; }

  /* ---------- Entrada breve y escalonada ---------- */
  .cab, h2, .res { animation: aparece .55s var(--entra) backwards; }
  h2 { animation-delay: .05s; }
  .res { animation-delay: .1s; }
  @keyframes aparece { from { opacity: 0; transform: translateY(8px); } }
  @keyframes brillo { from { transform: translateX(-130%); } to { transform: translateX(130%); } }
  @keyframes invita { 50% { fill: var(--negro); } }

  @media (hover: hover) and (pointer: fine) {
    .res:hover { filter: brightness(1.04); }
    .res:hover .fl { transform: translateX(4px); }
    .tl:hover { border-color: rgba(234, 202, 166, .6); }
    .redes a:hover { border-color: rgba(234, 202, 166, .7); transform: translateY(-2px); }
  }
  /* ---------- Formulario a WhatsApp: hoja que sube desde abajo (botonN_url = "formulario: …") ----------
     Sin JavaScript se abre con :target y trae una sola caja; con JavaScript, botones de motivo, nombre y detalle. */
  [hidden] { display: none !important; }
  .hoja { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; flex-direction: column; justify-content: flex-end; align-items: center; text-align: left; }
  html:not(.js) .hoja:target, .hoja.abierta { display: flex; }
  .con-hoja { overflow: hidden; }
  .hoja-velo { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, .7); animation: velo .2s ease-out; }
  .hoja-caja {
    position: relative; width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 22px 22px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
    border: 1px solid var(--linea); border-bottom: 0; border-radius: 24px 24px 0 0; background: var(--sup) linear-gradient(180deg, var(--sup2), var(--sup)); color: var(--texto);
    animation: hoja .32s var(--entra);
  }
  .hoja-caja:focus { outline: none; }
  .hoja-caja::before { content: ""; display: block; width: 40px; height: 4px; margin: -10px auto 14px; border-radius: 4px; background: var(--linea); }
  .hoja-x { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--linea); border-radius: 50%; color: var(--texto); }
  .hoja-x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .hoja-tit { margin: 0 52px 6px 0; font-size: 1.15rem; font-weight: 600; line-height: 1.25; }
  .fm-campo { margin: 14px 0 0; padding: 0; border: 0; min-width: 0; }
  .fm-et { display: block; margin: 0 0 8px; padding: 0; font-size: .9rem; font-weight: 600; color: var(--texto); }
  .fm-op { font-weight: 400; color: var(--suave); }
  .hoja input, .hoja textarea {
    display: block; width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid rgba(212, 176, 106, .55); border-radius: 12px;
    background: var(--fondo); color: var(--texto); font: inherit; font-size: 1rem; line-height: 1.4; -webkit-appearance: none; appearance: none;
  }
  .hoja textarea { resize: vertical; }
  .fm-sin-js textarea { min-height: 170px; }
  .hoja input:focus, .hoja textarea:focus { outline: 2px solid var(--oro); outline-offset: 1px; }
  .fm-chips { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 8px; }
  .fm-chips label { position: relative; display: block; }
  .fm-chips label:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .fm-chips input { position: absolute; top: 0; left: 0; width: 1px; height: 1px; min-height: 0; padding: 0; opacity: 0; }
  .fm-chips span {
    display: flex; align-items: center; justify-content: center; height: 100%; min-height: 52px; padding: 8px 10px; border: 1px solid rgba(212, 176, 106, .55); border-radius: 14px;
    font-weight: 600; font-size: .9rem; line-height: 1.2; text-align: center; overflow-wrap: anywhere; cursor: pointer;
    transition: background-color .15s var(--entra), color .15s var(--entra), transform .15s var(--entra);
  }
  .fm-chips input:checked + span { background: var(--oro); border-color: var(--oro); color: var(--negro); }
  .fm-chips input:focus-visible + span { outline: 2px solid var(--oro); outline-offset: 2px; }
  .fm-chips span:active { transform: scale(.97); transition-duration: .08s; }
  .fm-error { display: none; margin: 6px 0 0; font-size: .85rem; font-weight: 600; color: #ff8f80; }
  .mal .fm-error { display: block; }
  .mal input:not([type=radio]), .mal .fm-chips span { border-color: #ff8f80; }
  .fm-enviar {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; margin-top: 18px; padding: 10px 16px; border: 0; border-radius: 14px;
    background: var(--oro-a) linear-gradient(135deg, var(--oro-a), var(--oro) 55%, var(--oro-b)); color: var(--negro); font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .2s var(--entra), filter .2s var(--entra);
  }
  .fm-enviar svg { width: 22px; height: 22px; margin-right: 10px; fill: currentColor; }
  .fm-enviar:active { transform: scale(.975); filter: brightness(.92); transition-duration: .08s; }
  .fm-enviar:focus-visible, .hoja-x:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }
  .fm-priv { margin: 10px 0 0; font-size: .8rem; text-align: center; color: var(--suave); }
  @keyframes hoja { from { transform: translateY(100%); } }
  @keyframes velo { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cab, h2, .res, .tl, .res::after, .redes a, .res .est path, .wifi, .hoja-caja, .hoja-velo { animation: none; }
    .res, .tl, .redes a, .wifi summary, .fl, .fm-chips span, .fm-enviar { transition: none; }
    .fm-chips span:active, .fm-enviar:active { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="toldo{{TOLDO_CLASE}}">
      {{PORTADA_HTML}}
      <header class="cab{{CAB_CLASE}}">
        {{LOGO_HTML}}
        <h1 class="nom">{{NOMBRE}}</h1>
        {{SLOGAN_HTML}}
      </header>
      <h2>{{TITULAR}}</h2>
    </div>
    {{RESENA_HTML}}
    <nav class="rej n{{N_BOTONES}}">
      {{BOTONES}}
    </nav>
    {{WIFI_HTML}}
    <footer class="base">{{REDES_HTML}}{{PIE_HTML}}</footer>
  </main>
  {{FORMULARIOS_HTML}}
</body>
</html>
